<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Iniciar sesión — Consola Muscari</title>

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/consola.css" />
</head>

<body class="login-body">
  <main class="login">
    <!-- PANEL DE MARCA -->
    <section class="login__brand">
      <span class="login__logo">MUSCARI</span>

      <div class="login__brand-text">
        <span class="eyebrow">Culte tea house and afters</span>
        <h1 class="login__title">Consola</h1>
        <p class="login__lead">
          Reservas de mesa, solicitudes de evento e inscripciones, en un solo lugar.
        </p>
      </div>
    </section>

    <!-- FORMULARIO DE ACCESO -->
    <section class="login__panel">
      <form class="login__form" id="form-login" novalidate>
        <div class="login__heading">
          <span class="eyebrow eyebrow--terracotta">Acceso del equipo</span>
          <h2 class="login__subtitle">Iniciar sesión</h2>
        </div>

        <div class="field">
          <label for="usuario">Correo</label>
          <input type="email" id="usuario" name="usuario" autocomplete="username" autocapitalize="none"
            spellcheck="false" required />
        </div>

        <div class="field">
          <label for="clave">Contraseña</label>
          <div class="field__password">
            <input type="password" id="clave" name="clave" autocomplete="current-password" required />
            <button type="button" class="field__toggle" id="ver-clave" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <p class="login__error" id="login-error" role="alert" hidden></p>

        <button type="submit" class="btn btn--dark login__submit">Entrar a la consola</button>

        <p class="login__note">
          Solo para el equipo de Muscari. Si necesitas acceso, pídelo a quien administra la consola.
        </p>
      </form>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";

      // Si ya hay sesión activa, ir directo a la consola.
      if (window.MuscariAuth.haySesion()) {
        window.location.replace("consola.html");
        return;
      }

      var form = document.getElementById("form-login");
      var errorEl = document.getElementById("login-error");
      var claveInput = document.getElementById("clave");
      var toggle = document.getElementById("ver-clave");

      toggle.addEventListener("click", function () {
        var visible = claveInput.type === "text";
        claveInput.type = visible ? "password" : "text";
        toggle.textContent = visible ? "Mostrar" : "Ocultar";
        toggle.setAttribute("aria-pressed", visible ? "false" : "true");
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        var usuario = form.usuario.value.trim();
        var clave = form.clave.value;

        if (!usuario || !clave) {
          errorEl.textContent = "Escribe tu correo y tu contraseña.";
          errorEl.hidden = false;
          return;
        }

        var boton = form.querySelector(".login__submit");
        boton.disabled = true;

        window.MuscariAuth.iniciarSesion(usuario, clave).then(function (ok) {
          if (ok) {
            window.location.replace("consola.html");
            return;
          }

          boton.disabled = false;
          errorEl.textContent = "Correo o contraseña incorrectos. Intenta de nuevo.";
          errorEl.hidden = false;
          form.clave.value = "";
          form.clave.focus();
        });
      });
    })();
  </script>
</body>

</html>
